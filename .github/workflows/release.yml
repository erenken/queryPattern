name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-tests.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write
      id-token: write
    env:
      PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
      BUILD_COMMIT: ${{ needs.validate.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.401
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ needs.validate.outputs.artifact-name }}
          path: artifacts/packages
      - name: Guard stable version and immutable tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$PACKAGE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tag="v$PACKAGE_VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            [[ "$(git rev-list -n 1 "$tag")" == "$BUILD_COMMIT" ]]
          fi
      - name: Verify existing package provenance before duplicate skipping
        shell: pwsh
        run: ./scripts/Test-PublishedPackage.ps1 -Version $env:PACKAGE_VERSION -Commit $env:BUILD_COMMIT -AllowMissing
      - name: Authenticate to NuGet using GitHub OIDC
        uses: NuGet/login@v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish package and symbols (safe to rerun)
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet nuget push "artifacts/packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --no-symbols --skip-duplicate
          dotnet nuget push "artifacts/packages/*.snupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
      - name: Verify published package matches this commit
        shell: pwsh
        run: ./scripts/Test-PublishedPackage.ps1 -Version $env:PACKAGE_VERSION -Commit $env:BUILD_COMMIT -Attempts 60
      - name: Create matching stable GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$PACKAGE_VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$BUILD_COMMIT" --title "$tag" --generate-notes --draft=false --prerelease=false
          fi
          gh release upload "$tag" artifacts/packages/* --repo "$GITHUB_REPOSITORY" --clobber
